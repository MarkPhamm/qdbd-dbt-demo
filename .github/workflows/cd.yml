# CD — continuous deployment.
# Push to dev, qa or main (or press Run workflow) -> build that environment ->
# save the files the next pull request into that branch needs.
#
#   dev  -> --target dev    one flat `dev` schema
#   qa   -> --target qa     one flat `qa` schema, staging for main
#   main -> --target prod   split schemas (staging, conformed, lounge_reviews, ...)
#
# This file must not run on a pull request. That is ci.yml.

name: cd

on:
  push:
    branches: [main, qa, dev]
  workflow_dispatch:

# One queue per branch: a push to dev never waits for, or cancels, a qa deploy.
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      # main is production; dev and qa are targets of the same name.
      DBT_TARGET: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install the locked dbt
        run: |
          uv sync --frozen
          uv run dbt deps

      - name: Build ${{ env.DBT_TARGET }}
        run: uv run dbt build --target "$DBT_TARGET"

      # What slim CI needs: manifest.json to tell what a pull request modified,
      # and the database to --defer everything else to.
      - name: Stage artifacts
        run: |
          mkdir -p dbt_artifacts
          cp target/manifest.json dbt_artifacts/manifest.json
          cp database/database.duckdb dbt_artifacts/database.duckdb

      # Same name on every branch. ci.yml picks the right one by asking for the
      # latest successful run on the pull request's base branch.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: dbt_artifacts/
          if-no-files-found: error
          retention-days: 30
