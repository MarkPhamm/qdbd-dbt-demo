# Pages. One site, rebuilt on every deploy so one push never wipes another folder.
#
#   /            main's own model diagram
#   /sources.html
#   /qa/         qa's own model diagram, not a diff against main
#   /qa/sources.html
#   /dev/        dev's own model diagram, not a diff against qa
#   /dev/sources.html
#   /pr/N/       that pull request's model diagram, coloured against its base
#   /pr/N/sources.html
#   /pr/         list of those pull requests
#
# Model and source are always two builds. qdbd build erd would compile both
# into one schema. A branch that still has the diagram directly under erd/
# (no erd/models/) is built from that folder alone, and only as the model page.
#
# workflow_run runs on the default branch. The github-pages environment only
# accepts deploys from the default branch unless its rules are widened.

name: pages

on:
  workflow_run:
    workflows: [feature-cd-qdbd, release-ci-qdbd, feature-cd-dbt, release-cd-dbt]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build environment and pull request diagrams
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          qdbd() { uvx --from "quickdbd-cli==0.6.11" qdbd "$@"; }

          # --by-group draws one shaded region per file. One root per call, so
          # the model page never contains the source tables.
          build_root() {
            local dir="$1" root="$2" dest="$3"
            shift 3
            (cd "$dir" && qdbd build --by-group "$root" -o "$dest" "$@")
          }

          build_tree() {
            local dir="$1" out="$2"
            shift 2
            mkdir -p "$out"
            if [ -d "$dir/erd/models" ]; then
              build_root "$dir" erd/models "$out/index.html" "$@"
              if [ -d "$dir/erd/sources" ]; then
                build_root "$dir" erd/sources "$out/sources.html" "$@"
              fi
            else
              build_root "$dir" erd "$out/index.html" "$@"
            fi
          }

          mkdir -p site/pr envs
          git fetch --no-tags origin main qa dev
          git worktree add --detach envs/main origin/main
          git worktree add --detach envs/qa origin/qa
          git worktree add --detach envs/dev origin/dev
          build_tree envs/main "$GITHUB_WORKSPACE/site"
          build_tree envs/qa "$GITHUB_WORKSPACE/site/qa"
          build_tree envs/dev "$GITHUB_WORKSPACE/site/dev"

          : > "$RUNNER_TEMP/pr-lines.html"
          while IFS=$'\t' read -r num base; do
            [ -n "${num}" ] || continue
            [[ "$num" =~ ^[0-9]+$ ]] || continue
            [[ "$base" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
            git fetch --no-tags origin "refs/pull/${num}/head"
            git worktree add --detach "envs/pr-${num}" FETCH_HEAD
            git fetch --no-tags origin "+refs/heads/${base}:refs/remotes/origin/${base}"
            if build_tree "envs/pr-${num}" "$GITHUB_WORKSPACE/site/pr/${num}" --diff-base "origin/${base}"; then
              printf '<li><a href="%s/">%s</a> against %s</li>\n' "$num" "$num" "$base" >> "$RUNNER_TEMP/pr-lines.html"
            else
              printf '<li>%s against %s failed the schema check</li>\n' "$num" "$base" >> "$RUNNER_TEMP/pr-lines.html"
            fi
          done < <(gh pr list --state open --limit 100 --json number,baseRefName --jq '.[] | [.number, .baseRefName] | @tsv')

          cat > site/pr/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Pull request diagrams</title></head>
          <body>
          <h1>Pull request diagrams</h1>
          <ul>
          $(cat "$RUNNER_TEMP/pr-lines.html")
          </ul>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Comment the diagram link
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')
          if [ -z "$n" ]; then
            echo "No pull request number on the triggering run."
            exit 0
          fi
          marker="<!-- qdbd-pr-demo -->"
          body=$(printf '%s\nModel diagram: %s/pr/%s/\nSource diagram: %s/pr/%s/sources.html\n' \
            "$marker" "${PAGE_URL%/}" "$n" "${PAGE_URL%/}" "$n")
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" -f body="$body" >/dev/null
          fi
