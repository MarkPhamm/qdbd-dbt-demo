# Pages. One site, rebuilt on every deploy so one push never wipes another folder.
#
#   /                this directory: main, qa, dev, and every open pull request
#   /model.html      main's own model diagram
#   /sources.html    main's own source diagram
#   /qa/             qa's own model diagram, not a diff against main
#   /qa/sources.html
#   /dev/            dev's own model diagram, not a diff against qa
#   /dev/sources.html
#   /pr/N/           that pull request's model diagram, coloured against its base
#   /pr/N/sources.html
#   /pr/             the same directory as /
#
# Model and source are always two builds. qdbd build erd would compile both
# into one schema. A branch that still has the diagram directly under erd/
# (no erd/models/) is built from that folder alone, and only as the model page.
#
# workflow_run runs on the default branch. The github-pages environment only
# accepts deploys from the default branch unless its rules are widened.

name: pages

on:
  workflow_run:
    workflows: [feature-cd-qdbd, release-ci-qdbd, feature-cd-dbt, release-cd-dbt]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build environment and pull request diagrams
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          qdbd() { uvx --from "quickdbd-cli==0.6.12" qdbd "$@"; }

          # models is the model page. At the site root that file is model.html,
          # because index.html is the directory. Inside qa/, dev/, and pr/N/
          # the model page is index.html. Every other folder under erd/
          # becomes <name>.html, so a third diagram is just another folder.
          manifest="$RUNNER_TEMP/diagrams.tsv"
          : > "$manifest"

          label_of() {
            case $(basename "$1") in
              models|erd) printf 'model' ;;
              *) basename "$1" ;;
            esac
          }

          file_of() {
            case $(basename "$1") in
              models|erd) printf 'index.html' ;;
              *) printf '%s.html' "$(basename "$1")" ;;
            esac
          }

          # qdbd names the browser tab after the folder, so every model page
          # would say "models". Say which branch or pull request it is.
          describe() {
            local where="$1" kind="$2" noun
            case "$kind" in
              model) noun="model diagram" ;;
              sources) noun="source diagram" ;;
              *) noun="$kind diagram" ;;
            esac
            case "$where" in
              main) printf 'Main %s' "$noun" ;;
              qa|dev) printf '%s %s' "$where" "$noun" ;;
              *) printf 'Pull request %s, %s' "$where" "$noun" ;;
            esac
          }

          cat > "$RUNNER_TEMP/retitle.py" << 'PY'
          import html, json, pathlib, re, sys
          path, title = sys.argv[1], sys.argv[2]
          file = pathlib.Path(path)
          text = file.read_text(encoding="utf-8")
          text = re.sub(r"<title>.*?</title>", "<title>" + html.escape(title) + "</title>", text, count=1)
          text = re.sub(
              r'("title"\s*:\s*)"(?:\\.|[^"\\])*"',
              lambda m: m.group(1) + json.dumps(title),
              text,
              count=1,
          )
          file.write_text(text, encoding="utf-8")
          PY

          record() {
            printf '%s\t%s\t%s\t%s\t%s\n' "$@" >> "$manifest"
          }

          build_root() {
            local dir="$1" root="$2" dest="$3"
            shift 3
            local log code=0
            log=$(cd "$dir" && qdbd build --by-group "$root" -o "$dest" "$@") || code=$?
            printf '%s\n' "$log"
            BUILT_SUMMARY=$(printf '%s\n' "$log" | sed -n 's/^Wrote .* (\(.*\))$/\1/p' | tail -1)
            return "$code"
          }

          roots_of() {
            local dir="$1" d name
            if [ -d "$dir/erd/models" ] || [ -d "$dir/erd/sources" ]; then
              find "$dir/erd" -mindepth 1 -maxdepth 1 -type d | sort | while read -r d; do
                if find "$d" -type f \( -name '*.txt' -o -name '*.dbml' \) | grep -q .; then
                  name=$(basename "$d")
                  printf 'erd/%s\n' "$name"
                fi
              done
            elif [ -d "$dir/erd" ]; then
              printf 'erd\n'
            fi
          }

          build_tree() {
            local dir="$1" out="$2" group="$3" title="$4" prefix="$5"
            shift 5
            local root label file href
            mkdir -p "$out"
            while read -r root; do
              [ -n "$root" ] || continue
              label=$(label_of "$root")
              file=$(file_of "$root")
              if [ "$file" = index.html ] && [ -z "$prefix" ]; then
                file=model.html
              fi
              if [ "$file" = index.html ]; then
                href="${prefix}"
              else
                href="${prefix}${file}"
              fi
              if build_root "$dir" "$root" "$out/$file" "$@"; then
                name=$(describe "$title" "$label")
                python3 "$RUNNER_TEMP/retitle.py" "$out/$file" "$name"
                record "$group" "$title" "$name" "$href" "$BUILT_SUMMARY"
              else
                return 1
              fi
            done < <(roots_of "$dir" | awk '{ key = ($0 ~ /(^|\/)models$/ || $0 == "erd") ? "0" : "1"; print key "\t" $0 }' | sort | cut -f2-)
          }

          mkdir -p site/pr envs
          git fetch --no-tags origin main qa dev
          git worktree add --detach envs/main origin/main
          git worktree add --detach envs/qa origin/qa
          git worktree add --detach envs/dev origin/dev
          build_tree envs/main "$GITHUB_WORKSPACE/site" env main ""
          build_tree envs/qa "$GITHUB_WORKSPACE/site/qa" env qa "qa/"
          build_tree envs/dev "$GITHUB_WORKSPACE/site/dev" env dev "dev/"

          while IFS=$'\t' read -r num base; do
            [ -n "${num}" ] || continue
            [[ "$num" =~ ^[0-9]+$ ]] || continue
            [[ "$base" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
            git fetch --no-tags origin "refs/pull/${num}/head"
            git worktree add --detach "envs/pr-${num}" FETCH_HEAD
            git fetch --no-tags origin "+refs/heads/${base}:refs/remotes/origin/${base}"
            if ! build_tree "envs/pr-${num}" "$GITHUB_WORKSPACE/site/pr/${num}" pr "#$num against $base" "pr/${num}/" --diff-base "origin/${base}"; then
              record pr "#$num against $base" "" "" "schema check failed"
            fi
          done < <(gh pr list --state open --limit 100 --json number,baseRefName --jq '.[] | [.number, .baseRefName] | @tsv')

          python3 - "$manifest" site/index.html site/diagrams.html site/pr/index.html << 'PY'
          import html, sys
          from pathlib import Path

          rows = []
          for line in Path(sys.argv[1]).read_text().splitlines():
              if not line.strip():
                  continue
              group, title, label, href, summary = line.split("\t")
              rows.append((group, title, label, href, summary))

          def section(title, items, prefix):
              body = []
              for label, href, summary in items:
                  if href:
                      link = html.escape(prefix + href, quote=True)
                      name = html.escape(label)
                      meta = html.escape(summary)
                      body.append(
                          f'<li><a href="{link}">{name}</a><span>{meta}</span></li>'
                      )
                  else:
                      body.append(f'<li><span>{html.escape(summary)}</span></li>')
              return (
                  f'<section><h2>{html.escape(title)}</h2><ul>'
                  + "".join(body)
                  + "</ul></section>"
              )

          def page(prefix):
              envs, prs = [], []
              seen = []
              for group, title, label, href, summary in rows:
                  key = (group, title)
                  if key not in seen:
                      seen.append(key)
                  bucket = envs if group == "env" else prs
                  bucket.append((title, label, href, summary))
              parts = []
              for title in ("main", "qa", "dev"):
                  items = [(l, h, s) for t, l, h, s in envs if t == title]
                  if items:
                      parts.append(section(title, items, prefix))
              if prs:
                  parts.append('<h2 class="prs">Pull requests</h2>')
                  titles = []
                  for title, _, _, _ in prs:
                      if title not in titles:
                          titles.append(title)
                  for title in titles:
                      items = [(l, h, s) for t, l, h, s in prs if t == title and l]
                      if not items:
                          items = [("", "", s) for t, l, h, s in prs if t == title]
                      parts.append(section(title, items, prefix))
              css = (
                  ":root{color-scheme:light dark;--fg:#1f2328;--muted:#656d76;--bg:#fff;--line:#d0d7de}"
                  "@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#8d96a0;--bg:#0d1117;--line:#30363d}}"
                  "body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}"
                  "main{max-width:40rem;margin:0 auto;padding:2rem 1.25rem 4rem}"
                  "h1{font-size:1.35rem;font-weight:600;margin:0 0 1.5rem}"
                  "h2{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:1.4rem 0 .35rem;font-weight:600}"
                  "h2.prs{margin-top:2rem}"
                  "ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}"
                  "li{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line)}"
                  "a{color:inherit;font-weight:600;text-decoration:none;padding:.65rem 0}"
                  "span{color:var(--muted);padding:.65rem 0}"
              )
              return (
                  "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">"
                  "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">"
                  f"<title>Diagrams</title><style>{css}</style></head><body><main>"
                  "<h1>Diagrams</h1>"
                  + "".join(parts)
                  + "</main></body></html>\n"
              )

          Path(sys.argv[2]).write_text(page(""), encoding="utf-8")
          Path(sys.argv[3]).write_text(page(""), encoding="utf-8")
          Path(sys.argv[4]).parent.mkdir(parents=True, exist_ok=True)
          Path(sys.argv[4]).write_text(page("../"), encoding="utf-8")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Comment the diagram link
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')
          if [ -z "$n" ]; then
            echo "No pull request number on the triggering run."
            exit 0
          fi
          marker="<!-- qdbd-pr-demo -->"
          body=$(printf '%s\nModel diagram: %s/pr/%s/\nSource diagram: %s/pr/%s/sources.html\nAll diagrams: %s/\n' \
            "$marker" "${PAGE_URL%/}" "$n" "${PAGE_URL%/}" "$n" "${PAGE_URL%/}")
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id")
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" -f body="$body" >/dev/null
          fi
