# CI.
# A pull request into dev, qa or main opens two independent questions:
#   slim-ci  — are the numbers still right? Build only what changed, defer the
#              rest to the environment the pull request merges into.
#   erd      — does the diagram still match the yml, and what did it change?
#
# This file must not write to any environment. That is cd.yml.

name: ci

on:
  pull_request:
    branches: [main, qa, dev]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  slim-ci:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      DBT_CI_SCHEMA: ci_pr_${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install the locked dbt
        run: |
          uv sync --frozen
          uv run dbt deps

      # A pull request into qa is compared with qa, not with prod: the base
      # branch's last green cd.yml run is the state it merges into.
      - name: Download the base branch's CD artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
        run: |
          mkdir -p base_dbt_artifacts database
          RUN_ID=$(gh run list \
            --workflow=cd.yml \
            --branch="$BASE" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful cd.yml run on $BASE yet."
            echo "Push to $BASE once (or Run workflow on it) so CD can upload artifacts."
            exit 1
          fi
          gh run download "$RUN_ID" --name dbt-artifacts --dir base_dbt_artifacts
          cp base_dbt_artifacts/database.duckdb database/database.duckdb

      - name: Slim CI
        run: >
          uv run dbt build --target ci
          --select state:modified+
          --defer --state base_dbt_artifacts/

  # Shares nothing with slim-ci, and needs no dbt at all: qdbd reads the
  # model yml through `# @dbt: ../..` in erd/conformed/conformed.txt.
  # --strict fails the pull request when the diagram and the yml disagree (a
  # column on one side only, a type mismatch, a table with no model). The
  # comment shows what the pull request changes in the diagram, against its
  # base branch.
  erd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the action posts one comment
    steps:
      - uses: actions/checkout@v4

      - uses: MarkPhamm/quickdbd-cli@v0.6.0
        with:
          path: erd
          strict: "true"
          qdbd-version: "0.6.0"
