version: 2

models:
  - name: orders
    description: "One row per order. Payment count and amount come from int_order_payments."
    config:
      tags: [mart]
    columns:
      - name: order_id
        description: "Primary key."
        data_type: integer
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Who placed the order."
        data_type: integer
        data_tests:
          # A relationships test spans two models. In a deferred CI run one of
          # them may live in prod and the other in ci_pr_42, and it still passes.
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        description: "Date the order was placed."
        data_type: date
      - name: status
        description: "completed, returned, or placed."
        data_type: varchar
      - name: payment_count
        description: "Payments taken against the order. Zero when none have landed."
        data_type: bigint
      - name: amount
        description: "Payment total in dollars. Zero when the order has no payments."
        data_type: double

  - name: customers
    description: "One row per customer, with order history summarised."
    config:
      tags: [mart]
    columns:
      - name: customer_id
        description: "Primary key."
        data_type: integer
        data_tests: [unique, not_null]
      - name: first_name
        description: "Given name."
        data_type: varchar
      - name: last_name
        description: "Family name."
        data_type: varchar
      - name: first_order
        description: "Date of the customer's earliest order."
        data_type: date
      - name: most_recent_order
        description: "Date of the customer's latest order."
        data_type: date
      - name: number_of_orders
        description: "Orders placed. Zero when the customer has never ordered."
        data_type: bigint
      - name: lifetime_value
        description: "Sum of order amounts, in dollars."
        data_type: double
        data_tests: [not_null]
